<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer Matchs</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: transparent;
    }

    #clock {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 1.5rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      background-color: rgba(0, 0, 0, 0.80);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .notifBox {
      display: flex;
      position: fixed;
      left: 0;
      bottom: 0;

      align-items: center;
      margin: 1em;

      opacity: 0;
      transform: translateX(-100%);
      transition: all 0.6s ease;
    }

    .notifBox img {
      width: 75px;
      height: 75px;
      background-color: black;
      border-radius: 100%;

      transform: scale(0);
      animation: growIn 0.5s ease forwards;
    }

    .notifBox #textContainer {
      margin-left: 1em;
      background-color: black;
      color: white;
      padding: 2px 1em;
      border-radius: 10px;
    }

    .notifBox #text {
      transform: translateX(100%);
      animation: textSlide 1s ease forwards 0.6s;
    }

    .visible {
      opacity: 1;
      transform: translateX(0);
    }

    @keyframes growIn {
      to {
        transform: scale(1);
      }
    }

    @keyframes textSlide {
      to {
        transform: translateX(0);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateX(-100%);
      }
    }
  </style>
</head>

<body>

  <div class="notifBox" id="notif">
    <img id="imgLogo" src="/assets/logo.png">
    <div id="textContainer">
      <p id="text">Loading...</p>
    </div>
  </div>

  <div id="clock"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io("/viewer");

    /** ---------------- [ Notif Handler ] ----------------- */

      /** Réception des notifs via le websocket*/
    socket.on("notif", (datas) => {
      let { content, sound, duration } = datas;

      if (!content || content == " " || content == "") return;

      duration = parseInt(duration);
      if (isNaN(duration)) duration = -1;

      sendNotif({ content, sound, duration });
    })

      /** Variables de liaison à l'HTML */
    const notifContainer = document.getElementById("notif");
    const text = document.getElementById("text");

    let notifWaitList = [];
    let currentNotifId = null;

    function generateID() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
    }

      /** Gestion des notifications*/
    function sendNotif(datas) {
      datas = { id: generateID(), ...datas };
      
      if (!currentNotifId) {
        processNotif(datas);
      } else {
        notifWaitList.push(datas);
      };
    };

    async function processNotif(datas) {
      currentNotifId = datas.id;

      text.innerHTML = datas.content;

      notifContainer.style.animation = "none";
      notifContainer.offsetHeight;
      notifContainer.style.animation = "fadeIn 0.6s ease forwards";
      notifContainer.classList.add("visible");

      if (datas.sound) {
        var audio = new Audio("/assets/alertNotif.mp3");
        audio.play();
      };

      if (datas.duration) {
        await new Promise(resolve => setTimeout(() => resolve(), datas.duration * 1000));
        hideNotif(currentNotifId);
      };
    };

    async function hideNotif(notifID) {

      // TODO : Animation de départ
      notifContainer.style.animation = "fadeOut 0.8s ease forwards";

      setTimeout(() => {
        notifContainer.classList.remove("visible");
        text.innerHTML = "";

        setTimeout(() => {
          currentNotifId = null;
          if (notifWaitList.length > 0) {
            processNotif(notifWaitList.shift());
          };
        }, 250)
      }, 850);
    }
  
    /** ---------------- [ Clock Handler ] ----------------- */
    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');

      document.getElementById('clock').textContent = `${hours}h${minutes}`;
    }

    setInterval(updateClock, 5 * 1000);
    updateClock();
  </script>

</body>

</html>
