<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @keyframes fadeOut {
      from { 
        opacity: 1;
      }
      to   {
        opacity: 0;
      }
    }

    body {
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: black;

      text-align: center;
    }

    .hidden {
      display: none;
    }

    table {
      border: 1px solid black;
      background-color: rgba(71, 140, 252, 0.6);
      border-radius: 15px;
      padding: 10px;

      border-collapse: separate;
      border-spacing: 0;
    }

    .matchInfos {
      padding-bottom: 10px;
    }


    .spaceP {
      padding-right: 1em;
      text-align: left;
    }

    .spaceS {
      padding-right: 10px;
      padding-left: 10px;
    }

    .bordBottom {
      border-bottom: 1px solid #ffffff;
    }

    .bordRight {
      border-right: 1px solid #ffffff;
    }

    .animationOff {
      animation: fadeOut 5s ease forwards;
    }
  </style>

  <title>FloorOverlay</title>
</head>

<body>
  <table id="tableau" class="">
    <tr>
      <th colspan="4" class="matchInfos" id="matchInfos">Loading... - Loading... | Loading...</th>
    </tr>
    <tr>
      <td class="bordBottom bordRight"></td>
      <th class="bordBottom bordRight spaceS">Set 1</th>
      <th class="bordBottom bordRight spaceS">Set 2</th>
      <th class="bordBottom spaceS">Set 3</th>
    </tr>
    <tr>
      <th class="bordBottom bordRight spaceP" id="p1">Loading...</th>
      <td class="bordBottom bordRight" id="p1-s1">Loading...</td>
      <td class="bordBottom bordRight" id="p1-s2">Loading...</td>
      <td class="bordBottom" id="p1-s3">Loading...</td>
    </tr>
    <tr>
      <th class="bordRight spaceP" id="p2">Loading...</th>
      <td class="bordRight" id="p2-s1">Loading...</td>
      <td class="bordRight" id="p2-s2">Loading...</td>
      <td id="p2-s3">Loading...</td>
    </tr>
  </table>


  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Récupère le chemin actuel, ex: /floor1, /floor2, etc.
    const currentNamespace = window.location.pathname;

    // Se connecte au bon namespace automatiquement
    const socket = io(currentNamespace);

    socket.on("update", (datas) => {
      if (datas) {
        if (document.getElementById("tableau").classList.contains("hidden")) {
          document.getElementById("tableau").classList.remove("animationOff")
          effetNeon();
        }

        document.getElementById("matchInfos").innerHTML = `${datas.round} - ${datas.category} | ${datas.duration}`

        document.getElementById("p1").innerHTML = `${datas.server1 == '1' ? "𒊹 " : ""}${datas.player1.replaceAll('/', "<br>")}`;
        document.getElementById("p1-s1").innerHTML = datas.player1Set1;
        document.getElementById("p1-s2").innerHTML = datas.player1Set2;
        document.getElementById("p1-s3").innerHTML = datas.player1Set3;

        document.getElementById("p2").innerHTML = `${datas.server2 == '1' ? "𒊹 " : ""}${datas.player2.replaceAll('/', "<br>")}`;
        document.getElementById("p2-s1").innerHTML = datas.player2Set1;
        document.getElementById("p2-s2").innerHTML = datas.player2Set2;
        document.getElementById("p2-s3").innerHTML = datas.player2Set3;

        if (datas.winner) {

          setTimeout(() => {
            document.getElementById("tableau").classList.toggle("animationOff");
            setTimeout(() => {
              document.getElementById("tableau").classList.toggle("hidden");
            }, 5000)
          }, 20000);
        }
      }
    });

    socket.on("hide", () => {
      document.getElementById("tableau").classList.add("hidden")
    });


    function effetNeon() {
      const el = document.getElementById("tableau");

      // Séquence aléatoire de clignotements
      const clignotements = [100, 250, 120, 175, 200, 125, 300, 75, 500, 25]; // durées entre ON/OFF
      let i = 0;
      let visible = el.classList.contains("hidden");

      function clignote() {
        if (i < clignotements.length) {
          if (visible) {
            el.classList.add("hidden");
          } else {
            el.classList.remove("hidden");
          }
          visible = !visible;
          setTimeout(clignote, clignotements[i]);
          i++;
        }
      }

      clignote();
    }
  </script>

</body>

</html>
