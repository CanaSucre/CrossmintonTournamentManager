<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="/css/global.css" />
  <link rel="stylesheet" type="text/css" href="/css/tournament.css" />

  <title>Tournament Manager</title>
</head>

<body>
  <div class="container-fluid" id="tournament-container">
    <div class="row">
      <header class="col">
        <h1 class="my-2">Crossminton Tournament Manager</h1>
        <h3 id="tournamentName"></h3>
      </header>
    </div>

    <main>
      <div class="row">

        <div id="actionBar" class="px-3 py-2 m-3 rounded-3 col">

          <h5 class="my-2"><i class="bi bi-cursor"></i> Actions</h5>
          <div class="d-flex gap-2 my-2" id="actionBarBtn">

          </div>

        </div>

        <div id="statBar" class="px-3 py-2 m-3 rounded-3 col">

          <h5 class="my-2"><i class="bi bi-bar-chart-line"></i> Statistiques</h5>

          <div class="d-flex gap-2 my-2" id="statBarContent">

          </div>

        </div>
      </div>

      <div class="row">
        <div id="matchesList" class="px-3 py-2 m-3 rounded-3 col-6">

          <h5 class="my-2"><i class="bi bi-list-ul"></i> Matchs</h5>

          <div id="matchesListContent" class="d-flex flex-column my-2">
          </div>

        </div>
      </div>
    </main>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/tournament.js"></script>

</body>
</html>
