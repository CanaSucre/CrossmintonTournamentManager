<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link href="/bootstrap/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="/css/global.css" />
  <link rel="stylesheet" type="text/css" href="/css/tournament.css" />

  <title>Tournament Manager</title>
</head>

<body>
  <div class="container-fluid" id="tournament-container">
    <div class="row">
      <header class="col">
        <h1 class="my-2">Crossminton Tournament Manager</h1>
        <h3 id="tournamentName"></h3>
      </header>
    </div>

    <main>
      <div class="row">

        <div id="actionBar" class="px-3 py-2 m-3 rounded-3 col">

          <h5 class="my-2"><i class="bi bi-cursor"></i> Actions</h5>
          <div class="d-flex gap-2 my-2" id="actionBarBtn">

          </div>

        </div>

        <div id="statBar" class="px-3 py-2 m-3 rounded-3 col">

          <h5 class="my-2"><i class="bi bi-bar-chart-line"></i> Statistiques</h5>

          <div class="d-flex gap-2 my-2" id="statBarContent">

          </div>

        </div>
      </div>

      <div class="row">
        <div id="matchesList" class="px-3 py-2 m-3 rounded-3 col-6">

          <div class="d-flex align-items-center justify-content-between my-2">

            <h5 class="mb-0">
              <i class="bi bi-list-ul"></i> <a id="matchListTitle">Matchs</a>
            </h5>

            <div class="d-flex gap-3">
              <select id="matchSort" class="form-select form-select-sm w-auto">
                <option value="num_match" selected>N° Match</option>
                <option value="categorie">Catégorie</option>
                <option value="round">Round</option>
              </select>

              <select id="matchFilter_status" class="form-select form-select-sm w-auto">
                <option value="all" selected>Tous</option>
                <option value="in_progress">En cours</option>
                <option value="completed">Terminé</option>
                <option value="not_played">Non joué</option>
                <option value="started">Commencé</option>
                <option value="not_ended">Non terminé</option>
              </select>

              <select id="matchFilter_category" class="form-select form-select-sm w-auto">
                <option value="all" selected>Toute catégorie</option>
                <!-- Catégories remplies par le JS -->
              </select>
            </div>

          </div>

          <div id="matchesListContent" class="d-flex flex-column my-2">
            <!-- Rempli par le javascript -->
          </div>

        </div>
      </div>
    </main>
  </div>


  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div id="formError_editModal" class="alert alert-danger d-none" role="alert">
        </div>

        <div class="modal-header">
          <h5 class="modal-title">Modifier le tournoi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input type="text" class="form-control" id="nom">
            </div>

            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date">
            </div>

            <div class="mb-3">
              <label class="form-label">Nombre de terrains</label>
              <input type="number" class="form-control" id="nombreTerrains">
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-success" type="submit" form="editForm">Enregistrer</button>
        </div>

      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">Confirmer votre action</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-footer">
          <button class="btn btn-success" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-danger" type="submit" form="ajoutForm">Confirmer</button>
        </div>

      </div>
    </div>
  </div>

   <div class="modal fade" id="loadMatchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div id="formError_loadMatchModal" class="alert alert-danger d-none" role="alert">
        </div>

        <div class="modal-header">
          <h5 class="modal-title">Charger les matchs</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="loadMatchForm">
            <div class="mb-3">
              <label class="form-label">Contenu du fichier CSV</label>
              <textarea class="form-control" id="matchsForm" rows="8" placeholder="N°;CATEGORIE;TOUR;NOM1;NOM2&#10;1;OPEN;POULE 1;GABILLARD R;MALGOR T"></textarea>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-success" type="submit" form="loadMatchForm">Charger</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/tournament.js"></script>

</body>

</html>
