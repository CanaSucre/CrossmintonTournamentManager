<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <link href="/bootstrap/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="/css/global.css" />
  <link rel="stylesheet" type="text/css" href="/css/index.css" />

  <title>Tournament Manager</title>
</head>

<body>

  <div class="container-fluid">

    <div class="row">
      <header class="col">
        <h1 class="my-2">Crossminton Tournament Manager</h1>
      </header>
    </div>

    <main id="tournamentList">

    </main>


    <aside>
      <button id="createTournamentBtn" type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#ajoutModal" onclick="masquerErreur()">
        <i class="bi bi-plus-lg"></i>
      </button>
    </aside>

  </div>


  <div class="modal fade" id="ajoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div id="formError" class="alert alert-danger d-none" role="alert">
        </div>

        <div class="modal-header">

          <h5 class="modal-title">Ajouter un tournoi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="ajoutForm">
            <div class="mb-3">
              <label class="form-label">Nom</label>
              <input type="text" class="form-control" id="nom">
            </div>

            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date">
            </div>

            <div class="mb-3">
              <label class="form-label">Nombre de terrains</label>
              <input type="number" class="form-control" id="nombreTerrains">
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-success" type="submit" form="ajoutForm">Enregistrer</button>
        </div>

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/index.js"></script>

</body>

</html>
