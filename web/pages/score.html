<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" type="text/css" href="/css/score.css" />

        <title>Panel des Scores</title>
    </head>
    <body>
      <header>
        <h1 id="title">Scores en Direct : Loading...</h1>
        <p id="date">- Loading... -</p>
      </header>

      <main>
        <section id="scoreSection">

        </section>
      </main>

    </body>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io("/score");

      socket.on("load", (datas) => {
        document.getElementById("title").innerHTML = `Scores en Direct : ${datas.name}`;
        document.getElementById("date").innerHTML = `- ${datas.date} -`;

        const section = document.getElementById("scoreSection");
        section.innerHTML = "";

        for (let i = 0; i < datas.amountFloors; i++) {
          const div = document.createElement("div");
          div.innerHTML = `<h4>Terrain N°${i+1}</h4>`
          
          console.log(datas.ipAdressReseau);

          const iframe = document.createElement("iframe");
          iframe.setAttribute("src", `http://${datas.ipAdressReseau}:${datas.port}/floor${i+1}`);

          div.appendChild(iframe);
          section.appendChild(div);
        };
      });
    </script>
</html>
